- defaults:
    create:
      mode: 0755
    link:
      relink: true

- clean: ["~"]

- create:
    ~/.ssh:
      mode: 0700
    ~/projects/github:

- link:
    ~/.vimrc: vimrc
    ~/.bashrc: .bashrc
    ~/.local/bin/:
      glob: true
      path: local/bin/*
      create: true
    ~/.config/:
      glob: true
      path: config/*
      create: true
      exclude:
        - config/fish
        - config/powershell
        - config/glazewm
